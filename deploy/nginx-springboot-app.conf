# Nginx の設定：画面（frontend/dist）を 80 番で配り、/api は Spring Boot（8080 番）に渡す
# 置き場所：/etc/nginx/conf.d/springboot-app.conf

# default_server をつけているので、IP アドレスで来たアクセスはこの設定で受ける
# （nginx.conf にもとからある 80 番の設定は使われなくなる。server_name _ は
#   そちらと重なって警告が出るので書かない）
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 画面（npm run build でできた dist の中身）
    root /usr/share/nginx/springboot-app;
    index index.html;

    # 画面のファイル。見つからないときは index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API は Spring Boot に渡す（Spring Boot は 127.0.0.1:8080 でだけ待っている）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
