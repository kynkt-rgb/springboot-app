spring.application.name=backend

# --- データベース（PostgreSQL）への接続設定 ---
# ${名前:初期値} は「環境変数があればそれを使い、なければ初期値を使う」という意味
# 初期値は Docker の PostgreSQL（springboot-app/compose.yaml、5433番）につなぐ設定
# Homebrew の PostgreSQL（5432番）に戻したいときは、環境変数で上書きする:
#   DB_URL=jdbc:postgresql://localhost:5432/springboot_app DB_USERNAME=kiyono DB_PASSWORD= ./gradlew bootRun
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/springboot_app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

# --- JPA（エンティティと表をつなぐ仕組み）の設定 ---
# エンティティを見て、表が無ければ作る・足りない列があれば足す（練習用の設定）
spring.jpa.hibernate.ddl-auto=update
# 実行した SQL をログに出す（表が作られる様子が見える）
spring.jpa.show-sql=true

# --- エラーのときの返事 ---
# エラーの理由（例: 「タイトルを入力してください」）を返事に入れる。
# これが無いと理由が空になり、画面に「なぜダメだったか」を出せない
# （Spring Boot 4 では server.error... ではなく spring.web.error... という名前）
spring.web.error.include-message=always
